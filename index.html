<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban PFE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Mes candidatures PFE</h1>
    <div id="barre-utilisateur" class="barre-utilisateur" hidden>
      <span id="email-utilisateur"></span>
      <button id="btn-deconnexion" class="btn-secondaire">Se déconnecter</button>
    </div>
    <div id="barre-actions" class="barre-actions" hidden>
      <button id="btn-ajouter" class="btn-principal">+ Nouvelle candidature</button>
      <button id="btn-exporter" class="btn-secondaire">Exporter</button>
    </div>
  </header>

  <section id="ecran-connexion" class="auth" hidden>
    <form id="formulaire-auth">
      <h2 id="titre-auth">Connexion</h2>

      <label>Email
        <input type="email" id="auth-email" required autocomplete="email">
      </label>

      <label>Mot de passe
        <input type="password" id="auth-mdp" required minlength="8" maxlength="72" autocomplete="current-password">
      </label>

      <p id="message-auth" class="message-auth" role="alert" hidden></p>
      <p class="info-auth">Seuls ton email et tes candidatures sont enregistrés. Utilise un mot de passe que tu n'emploies pas ailleurs.</p>
      <button type="submit" id="btn-valider-auth" class="btn-principal">Se connecter</button>

      <p class="bascule-auth">
        <button type="button" id="btn-basculer-auth" class="lien-bouton">Pas de compte ? Créer un compte</button>
      </p>
    </form>
  </section>

  <main class="board" id="tableau" hidden>

    <section class="column" id="a-envoyer">
    <h2>À envoyer</h2>
    <div class="cards"></div>
    </section>

    <section class="column" id="envoyee">
    <h2>Envoyée</h2>
    <div class="cards"></div>
    </section>

    <section class="column" id="relancee">
    <h2>Relancée</h2>
    <div class="cards"></div>
    </section>

    <section class="column" id="entretien">
    <h2>Entretien</h2>
    <div class="cards"></div>
    </section>

    <section class="column" id="acceptee">
    <h2>Acceptée</h2>
    <div class="cards"></div>
    </section>

    <section class="column" id="refusee">
    <h2>Refusée</h2>
    <div class="cards"></div>
    </section>

</main>
<dialog id="fenetre-ajout">
<form id="formulaire">
<h2 id="titre-formulaire">Nouvelle candidature</h2>

<label>Entreprise
        <input type="text" id="champ-entreprise" required>
</label>

<label>Poste
        <input type="text" id="champ-poste" required>
</label>

<label>Date
        <input type="date" id="champ-date" required>
</label>

<label>Colonne
        <select id="champ-statut">
<option value="a-envoyer">À envoyer</option>
<option value="envoyee">Envoyée</option>
<option value="relancee">Relancée</option>
<option value="entretien">Entretien</option>
<option value="acceptee">Acceptée</option>
<option value="refusee">Refusée</option>
        </select>
    </label>

    <label>Lien de l'offre
        <input type="url" id="champ-lien" placeholder="https://...">
    </label>

<label>Notes
        <textarea id="champ-notes" rows="3"></textarea>
</label>

<div class="boutons-form">
        <button type="button" id="btn-annuler">Annuler</button>
        <button type="submit" class="btn-principal">Enregistrer</button>
</div>
    </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
